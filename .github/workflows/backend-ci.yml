name: Backend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "database/**"
      - "docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - "jest.config.js"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "database/**"
      - "docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - "jest.config.js"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: grandstay_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_with_more_than_32_chars
      JWT_EXPIRES_IN: 8h
      ADMIN_OTP: "123456"
      PAYMENT_GATEWAY_URL: https://api.pasarela-mock.com
      PAYMENT_GATEWAY_KEY: mock_key
      DB_HOST: localhost
      DB_PORT: "3306"
      DB_NAME: grandstay_db
      DB_NAME_TEST: grandstay_db
      DB_USER: root
      DB_PASSWORD: root
      DB_SSL_MODE: DISABLED
      INTEGRANTES_CODE_SECRET: ci_integrantes_secret_with_more_than_32_chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Load database schema
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot < database/grandstay_db.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot < database/seed-data.sql

      - name: Run unit tests
        run: npx jest src/tests/unit --runInBand --coverage=false --forceExit

      - name: Run integration tests
        run: npx jest src/tests/integration --runInBand --coverage=false --forceExit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: grand-stay-backend:ci
